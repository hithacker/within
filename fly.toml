app = "within-reflection-api-hiren"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  GEMINI_MODEL = "gemini-2.5-flash"
  ALLOWED_ORIGINS = "https://within-authoring-studio-hiren.fly.dev,http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:19006"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
